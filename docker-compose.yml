services:
  karaoke-app:
    image: ghcr.io/sal0-apps/sal0-karaoke:12.7.6
    container_name: karaoke-app
    labels:
      icon: "https://raw.githubusercontent.com/Sal0-Apps/Sal0-Karaoke/main/app/templates/app-icon-v8.png?v=12.5.1"
    ports:
      - "7885:7860"
    volumes:
      - ./data:/data
    environment:
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
    restart: unless-stopped

x-casaos:
  author: "Sal0"
  category: "Media"
  icon: "https://raw.githubusercontent.com/Sal0-Apps/Sal0-Karaoke/main/app/templates/app-icon-v8.png?v=12.5.1"
  title: "Sal0 Karaokê"
  port_map: "7885"
  overview: "Crie vídeos de karaokê localmente com Demucs, Whisper, letras-guia, contas separadas, Biblioteca, preview e Telegram."
