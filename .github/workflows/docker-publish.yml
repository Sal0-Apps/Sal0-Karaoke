name: Build, Publish and Release

on:
  push:
    branches: [main]
    paths: [VERSION, '.github/workflows/docker-publish.yml']
    tags:
      - 'v*'
  workflow_dispatch: # Dispara quando tags começando com v são criadas, ex: v1.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-client-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      android: ${{ steps.clients.outputs.android }}
      windows: ${{ steps.clients.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: clients
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: python .github/scripts/release_clients.py --before "$PREVIOUS_SHA" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build-windows-authorizer:
    needs: detect-client-changes
    if: needs.detect-client-changes.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build free standalone browser authorizer
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --onefile --console --name Sal0-YouTube-Conectar app/youtube_desktop_oauth.py
          ./dist/Sal0-YouTube-Conectar.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-youtube-authorizer
          path: dist/Sal0-YouTube-Conectar.exe
          if-no-files-found: error

  build-and-push:
    needs: [detect-client-changes, build-windows-authorizer]
    if: always() && needs.detect-client-changes.result == 'success' && (needs.build-windows-authorizer.result == 'success' || needs.build-windows-authorizer.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requerido para criar Releases do GitHub
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.detect-client-changes.outputs.windows == 'true'
        with:
          name: windows-youtube-authorizer
          path: app

      - name: Reuse unchanged Windows authorizer
        if: needs.detect-client-changes.outputs.windows != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHORIZER_URL=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'flatten | [.[] | select(.draft == false) | .assets[]? | select(.name == "Sal0-YouTube-Conectar.exe")][0].browser_download_url')
          test -n "$AUTHORIZER_URL" && test "$AUTHORIZER_URL" != "null"
          curl --fail --location --retry 3 --output app/Sal0-YouTube-Conectar.exe "$AUTHORIZER_URL"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: Set up release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME#v}"
          else
            VERSION_TAG=$(cat VERSION)
          fi
          [[ "$VERSION_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_TAG"
          PATCH=${PATCH:-0}
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          # Publica a versão validada e o alias latest.
          tags: |
            ${{ env.IMAGE_TAG }}:latest
            ${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}

      - name: Validate application rules in the built image
        timeout-minutes: 10
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/validation:ro" --workdir /validation --entrypoint python "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}" -m unittest discover -s tests -v

      - name: Validate CPU BVE inference, output stems and app routes
        timeout-minutes: 15
        run: docker run --rm --entrypoint python "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}" smoke_backing_runtime.py

      - name: Test real Whisper CPU runtime
        timeout-minutes: 8
        run: docker run --rm --entrypoint python "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}" smoke_whisper_runtime.py

      - name: Set up Java for Android build
        if: needs.detect-client-changes.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: needs.detect-client-changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        if: needs.detect-client-changes.outputs.android == 'true'
        working-directory: android
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease -PVERSION_NAME=${{ env.VERSION_TAG }} -PVERSION_CODE=${{ env.VERSION_CODE }}
          test -f app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Sal0-Karaoke-v${{ env.VERSION_TAG }}.apk

      - name: Push validated Docker image
        run: |
          docker push "${{ env.IMAGE_TAG }}:${{ env.VERSION_TAG }}"
          docker push "${{ env.IMAGE_TAG }}:latest"

      - name: Select only newly built client assets
        id: release_assets
        env:
          BUILD_ANDROID: ${{ needs.detect-client-changes.outputs.android }}
          BUILD_WINDOWS: ${{ needs.detect-client-changes.outputs.windows }}
        run: |
          {
            echo 'files<<RELEASE_FILES'
            if [[ "$BUILD_ANDROID" == 'true' ]]; then
              echo "android/app/build/outputs/apk/release/Sal0-Karaoke-v${VERSION_TAG}.apk"
            fi
            if [[ "$BUILD_WINDOWS" == 'true' ]]; then
              echo 'app/youtube_desktop_oauth.py'
              echo 'app/Sal0-YouTube-Conectar.exe'
            fi
            echo 'RELEASE_FILES'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          name: Sal0 Karaoke v${{ env.VERSION_TAG }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.release_assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
