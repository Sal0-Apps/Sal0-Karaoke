name: Validate YouTube administration
on:
  pull_request:
    paths:
      - 'app/templates/index.html'
      - 'app/youtube_publisher.py'
      - 'tests/**'
      - '.github/workflows/validate-youtube-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install requests==2.32.3 numpy
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 240 apt-get update -qq
            sudo timeout 240 apt-get install -y ffmpeg
          fi
          python -m compileall -q app
          python -m unittest discover -s tests -p test_whisper_audio.py -v
          python -m unittest discover -s tests -p test_youtube_connection_feedback.py -v
          python -m unittest discover -s tests -p test_youtube_publisher.py -v
          python -m unittest discover -s tests -p test_srt_youtube_block.py -v
          python -m unittest discover -s tests -p test_random_video_background.py -v
          python -m unittest discover -s tests -p "test_subtitle*.py" -v
          python -m unittest discover -s tests -p "test_backing*.py" -v
          python -m unittest discover -s tests -p test_automatic_lyrics_and_search.py -v
          python -m unittest discover -s tests -p test_synced_acoustic_animation.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --prefix /tmp/sal0-ui playwright@1.51.1
          /tmp/sal0-ui/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/sal0-ui/node_modules node tests/browser_youtube_publisher.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-admin-layout
          path: youtube-admin-*.png
          if-no-files-found: ignore
